<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hello Mell</title>
    <link rel="stylesheet" href="hayuk.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
    <a href="ikibrandae.html">Home</a>

    <div class="logo">
        <h2>Hello Mell</h2>
        <p>PRETTY NAILS, PRETTY MOOD</p>
    </div>

    <a href="chat-admin.html">Support</a>
</header>

<!-- LOGIN -->
<main class="login-container">

    <div class="login-box">

        <p class="back">Beranda</p>

        <h1>Selamat Datang Kembali</h1>

        <form id="formLogin">

            <label>Email atau Nomor WhatsApp</label>
            <input type="text" placeholder="Email atau Nomor WhatsApp" required>

            <div class="password-label">
                <label>Kata Sandi</label>
                <a href="#">Lupa Kata Sandi?</a>
            </div>

            <input type="password" placeholder="Kata Sandi" required>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Ingat saya di perangkat ini</label>
            </div>

            <button type="submit">Masuk Sekarang</button>

        </form>

        <p class="account-link">
            Belum punya akun?
            <a href="masuk.html">Daftar Akun Baru</a>
        </p>

    </div>

</main>

<!-- FOOTER -->
<footer class="footer">
    <p>&copy; 2025 Hello Mell Nail Salon. All rights reserved.</p>

    <div>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="chat-admin.html">Salon Support</a>
    </div>
</footer>

<!-- JAVASCRIPT -->
<script>
    document.getElementById("formLogin").addEventListener("submit", function(event) {
        event.preventDefault();

        localStorage.setItem("statusLogin", "true");

        window.location.href = "ikibrandae.html";
    });
</script>

</body>
</html>
