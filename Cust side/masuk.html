
<!DOCTYPE html>

</head>
<body>

<!-- HEADER -->
<header class="header">
    <a href="ikibrandae.html">Home</a>

    <div class="logo">
        <h2>Hello Mell</h2>
        <p>PRETTY NAILS, PRETTY MOOD</p>
    </div>

    <a href="chat-admin.html">Support</a>
</header>

<!-- REGISTRASI -->
<main class="login-container">

    <div class="login-box">

        <h1>Daftar Akun Baru</h1>

        <p class="register-description">
            Lengkapi data Anda dalam 1 menit dan nikmati
            kemudahan booking kuku estetik.
        </p>

        <form>

            <label>Nama Lengkap</label>
            <input type="text" placeholder="Nama Lengkap" required>

            <label>Nomor WhatsApp Aktif</label>
            <input type="tel" placeholder="Nomor WhatsApp" required>

            <label>Alamat Email</label>
            <input type="email" placeholder="nama@email.com" required>

            <div class="password-grid">

                <div>
                    <label>Kata Sandi Baru</label>
                    <input type="password" placeholder="Min. 8 karakter" required>
                </div>

                <div>
                    <label>Konfirmasi Kata Sandi</label>
                    <input type="password" placeholder="Ulangi kata sandi" required>
                </div>

            </div>

            <button type="submit">Buat Akun Member Sekarang</button>

        </form>

        <p class="account-link">
            Sudah memiliki akun?
            <a href="login.html">Masuk di sini</a>
        </p>

    </div>

</main>
